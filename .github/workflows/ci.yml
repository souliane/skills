name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - uses: j178/prek-action@v2
        env:
          SKIP: uv-audit

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # golden_diff shells out to these; without them its rendering tests skip and
      # the coverage gate measures a smaller suite than the floor was measured from.
      # fonts-dejavu-core is what _find_montage_font() looks for on Debian, so
      # montage takes its labelled path rather than the unlabelled fallback.
      # diff-pdf is deliberately absent: it is not packaged for Ubuntu, so the two
      # overlay tests stay environment-gated rather than have CI build it from source.
      - name: Install the external tools the suite exercises
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-dejavu-core ghostscript imagemagick
      - run: uv run -p ${{ matrix.python-version }} pytest --no-header -q
