default_install_hook_types: [commit-msg, pre-commit]
default_stages: [commit, manual]
fail_fast: true

repos:
  # Phase 1 - Init
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 8ff2449591c8de025b17661ba76d60237a1ae62b  # 0.12.1
    hooks:
      - id: uv-lock
      - id: uv-sync
        args: ["--locked", "--all-packages"]

  # Phase 2 - Formatters
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 39d9ac5938dadb73df0564a45f163e25ff9fa6e2  # v0.16.1
    hooks:
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: \.html$
      - id: trailing-whitespace
        exclude: \.html$
      - id: mixed-line-ending
        exclude: \.m?html$
        args: [--fix=lf]
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b  # v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: [--fix]
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: d600c142bb19f521ae6a6a345f94a2efd7937759  # v2.26.0
    hooks:
      - id: pyproject-fmt
        files: ^pyproject\.toml$
  - repo: https://github.com/pappasam/toml-sort
    rev: 2970ae9bb7124fe5117a27e10c10d2da051ce05a  # v0.24.4
    hooks:
      - id: toml-sort-fix
        exclude: ^(pyproject\.toml|uv\.lock)$

  # Phase 3 - Fast syntax
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml

  # Phase 4 - Linters
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 39d9ac5938dadb73df0564a45f163e25ff9fa6e2  # v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: 3a6eb0fadf60b3cccfd80bad9dbb6fae7e47b316  # v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
      - id: text-unicode-replacement-char
  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # v2.4.3
    hooks:
      - id: codespell
        args: [--write-changes, --ignore-words-list=afterAll]
  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: 3aa28ce11a84d747c5695ad10b81945f2400b54f  # 3.8.0
    hooks:
      - id: editorconfig-checker
        exclude: \.m?html$

  # Phase 5 - Type check
  - repo: local
    hooks:
      - id: ty-check
        name: ty-check
        language: system
        entry: uv run ty check --exclude "ac-editing-acroforms/scripts/verify_*.py"
        pass_filenames: false

  # Phase 6 - Security & custom
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: scripts-have-uv-shebang
        name: scripts-have-uv-shebang
        language: pygrep
        entry: '#!/usr/bin/env -S uv run --script'
        args: [--negate]
        files: '.*/scripts/cli\.py$'
      - id: scripts-have-inline-metadata
        name: scripts-have-inline-metadata
        language: pygrep
        entry: '# /// script'
        args: [--negate]
        files: '.*/scripts/cli\.py$'
      - id: scripts-no-raw-sys-argv
        name: scripts-no-raw-sys-argv
        language: pygrep
        entry: 'sys\.argv'
        files: '.*/scripts/[^_][^/]*\.py$'
      - id: banned-terms
        name: banned-terms
        language: script
        entry: scripts/hooks/check-banned-terms.sh --config ~/.skills
        types: [text]
        exclude: ^(\.pre-commit-config\.yaml$|scripts/hooks/)

  # Phase 7 - Project-specific
  # The two shared repo-level scripts are owned by skill-repo-boilerplate; this
  # repo consumes them instead of keeping copies that drift.
  - repo: https://github.com/souliane/skill-repo-boilerplate
    rev: 1d57e6cbf94a545ef6342bb90a9b619b1fda2697  # 2026-08-04
    hooks:
      - id: update-readme-skills
      - id: bump-pyproject-deps-from-lock-file
        stages: [manual]
  - repo: local
    hooks:
      - id: check-skills
        name: check-skills
        language: system
        entry: uv run ac-reviewing-codebase/scripts/cli.py check
        pass_filenames: false
        always_run: true

  # Phase 8 - Slow
  - repo: local
    hooks:
      - id: uv-audit
        name: uv audit
        language: system
        entry: uv audit --preview-features audit
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$
        stages: [commit, manual]

  # Phase 9 - Manual
  - repo: https://github.com/semgrep/semgrep
    rev: 2d101bb3856dd243333af010d82979b74b54b309  # v1.172.0
    hooks:
      - id: semgrep
        additional_dependencies: [semgrep]
        args: [--config=p/ci, --error, --timeout=120]
        stages: [manual]

  # Phase 10 - Commit-msg
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 3db014c16a9d31997ab8c07a4d61fcce936c8f0d  # v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose]
